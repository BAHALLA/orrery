site_name: Orrery
site_description: >-
  SRE agents you can let near production. Autonomous DevOps & SRE agents that
  investigate, correlate and remediate — with a human gate on every destructive action.
site_url: https://bahalla.github.io/orrery/
repo_url: https://github.com/BAHALLA/orrery
repo_name: BAHALLA/orrery
edit_uri: edit/main/docs/

theme:
  name: material
  # docs/overrides adds the Open Graph / Twitter card tags (static image in
  # docs/assets/brand); Material's `social` plugin would generate one per page
  # but drags in cairo + pillow, which the docs build does not otherwise need.
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # `custom` hands the colours to stylesheets/extra.css, where they are the
    # console's own slate/blue tokens — one palette across the docs, the web
    # console and the brand assets.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.prune
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - content.tabs.link

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BAHALLA/orrery
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/orrery-core/

copyright: Copyright &copy; 2026 Taoufiq &mdash; Built with Google ADK

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: iso_date
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths: [core, agents/docker-agent, agents/elasticsearch, agents/kafka-health, agents/k8s-health, agents/observability, agents/orrery-assistant, agents/ops-journal, agents/slack-bot, agents/google-chat-bot]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

