# Triaged Trivy findings, with expiry dates.
#
# Every entry MUST carry `expired_at`. Trivy stops honouring an expired entry
# and the gate goes red again, which is the review mechanism — without it an
# ignore silently becomes permanent, and a permanent ignore is indistinguishable
# from not scanning.
#
# Wired explicitly via the `trivyignores` input in .github/workflows/ci.yml and
# release.yml: Trivy auto-loads a plain `.trivyignore` but NOT this YAML form,
# and only the YAML form supports expiry.
#
# Before adding an entry, exhaust the alternatives in order:
#   1. Upgrade the dependency (`uv lock --upgrade-package <name>`).
#   2. Re-pin the base/tool image to a rebuilt digest.
#   3. Remove the component if it is not actually needed.
# Only then triage, and say why in `statement` — a reader at 03:00 needs the
# reasoning, not the CVE id they already have.

# No open triage. The last block (Go stdlib in the bundled Docker CLI) was
# removed on 2026-10-10 by re-pinning docker:29-cli to a Go 1.26.9 build.
vulnerabilities: []
