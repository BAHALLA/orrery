[project]
name = "ops-journal"
version = "0.16.0"
description = "Agent demonstrating memory and state patterns in ADK"
requires-python = ">=3.14"
dependencies = [
    # [postgres] provides the psycopg2 + asyncpg drivers for PostgreSQL-backed
    # sessions and memory. No DATABASE_URL → in-memory.
    "orrery-core[postgres]",
]


# Registers this agent with the coordinator's specialist registry
# (orrery_core.registry). ORRERY_SPECIALISTS / ORRERY_DISABLED_SPECIALISTS
# select which registered specialists a deployment runs.
[project.entry-points."orrery.specialists"]
ops_journal = "ops_journal_agent.agent:specialist"

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ops_journal_agent*"]
