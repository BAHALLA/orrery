[project]
name = "kafka-health-agent"
version = "0.9.0"
description = "Agent for monitoring and managing Kafka cluster health"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core[kubernetes]",
    "confluent-kafka>=2.16.0",
    "kubernetes>=37.0.0",
]


# Registers this agent with the coordinator's specialist registry
# (orrery_core.registry). ORRERY_SPECIALISTS / ORRERY_DISABLED_SPECIALISTS
# select which registered specialists a deployment runs.
[project.entry-points."orrery.specialists"]
kafka = "kafka_health_agent.agent:specialist"

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kafka_health_agent*"]
