[project]
name = "k8s-health-agent"
version = "0.6.5"
description = "Agent for monitoring and managing Kubernetes clusters"
requires-python = ">=3.14"
dependencies = [
    "orrery-core[kubernetes]",
    "kubernetes>=37.0.0",
]


# Registers this agent with the coordinator's specialist registry
# (orrery_core.registry). ORRERY_SPECIALISTS / ORRERY_DISABLED_SPECIALISTS
# select which registered specialists a deployment runs.
[project.entry-points."orrery.specialists"]
k8s = "k8s_health_agent.agent:specialist"

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["k8s_health_agent*"]
