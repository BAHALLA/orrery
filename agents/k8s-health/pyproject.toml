[project]
name = "k8s-health-agent"
version = "0.4.1"
description = "Agent for monitoring and managing Kubernetes clusters"
requires-python = ">=3.14"
dependencies = [
    "orrery-core[kubernetes]",
    "kubernetes>=36.0.3",
]

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["k8s_health_agent*"]
