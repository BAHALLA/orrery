[project]
name = "orrery-assistant"
version = "0.4.0"
description = "DevOps orchestrator that delegates to specialized sub-agents"
requires-python = ">=3.14"
dependencies = [
    # [postgres] provides the psycopg2 (sync probe) + asyncpg (ADK) drivers
    # for PostgreSQL-backed sessions and memory. No DATABASE_URL → in-memory.
    "orrery-core[postgres]",
    "docker-agent",
    "elasticsearch-agent",
    "kafka-health-agent",
    "k8s-health-agent",
    "observability-agent",
    "ops-journal",
]

[tool.setuptools.packages.find]
include = ["orrery_assistant*"]

[tool.uv.sources]
orrery-core = { workspace = true }
docker-agent = { workspace = true }
elasticsearch-agent = { workspace = true }
kafka-health-agent = { workspace = true }
k8s-health-agent = { workspace = true }
observability-agent = { workspace = true }
ops-journal = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
