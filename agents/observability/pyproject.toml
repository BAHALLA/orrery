[project]
name = "observability-agent"
version = "0.6.9"
description = "Agent for monitoring Prometheus, Loki, and Alertmanager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
    "requests>=2.34.2",
]


# Registers this agent with the coordinator's specialist registry
# (orrery_core.registry). ORRERY_SPECIALISTS / ORRERY_DISABLED_SPECIALISTS
# select which registered specialists a deployment runs.
[project.entry-points."orrery.specialists"]
observability = "observability_agent.agent:specialist"

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observability_agent*"]
