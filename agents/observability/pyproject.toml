[project]
name = "observability-agent"
version = "0.4.0"
description = "Agent for monitoring Prometheus, Loki, and Alertmanager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
    "requests>=2.34.2",
]

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observability_agent*"]
