[project]
name = "docker-agent"
version = "0.4.0"
description = "Agent for managing Docker containers and images"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
]

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docker_agent*"]
