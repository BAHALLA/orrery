[project]
name = "docker-agent"
version = "0.9.1"
description = "Agent for managing Docker containers and images"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
]


# Registers this agent with the coordinator's specialist registry
# (orrery_core.registry). ORRERY_SPECIALISTS / ORRERY_DISABLED_SPECIALISTS
# select which registered specialists a deployment runs.
[project.entry-points."orrery.specialists"]
docker = "docker_agent.agent:specialist"

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docker_agent*"]
