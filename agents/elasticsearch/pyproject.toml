[project]
name = "elasticsearch-agent"
version = "0.6.1"
description = "Agent for monitoring Elasticsearch clusters (REST + ECK CRs on Kubernetes)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core[kubernetes]",
    "requests>=2.34.2",
    "kubernetes>=37.0.0",
]


# Registers this agent with the coordinator's specialist registry
# (orrery_core.registry). ORRERY_SPECIALISTS / ORRERY_DISABLED_SPECIALISTS
# select which registered specialists a deployment runs.
[project.entry-points."orrery.specialists"]
elasticsearch = "elasticsearch_agent.agent:root_agent"

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elasticsearch_agent*"]
