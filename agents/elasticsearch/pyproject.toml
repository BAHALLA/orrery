[project]
name = "elasticsearch-agent"
version = "0.4.1"
description = "Agent for monitoring Elasticsearch clusters (REST + ECK CRs on Kubernetes)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orrery-core",
    "requests>=2.34.2",
    "kubernetes>=36.0.3",
]

[tool.uv.sources]
orrery-core = { workspace = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elasticsearch_agent*"]
