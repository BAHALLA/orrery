name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      # Must run BEFORE `uv sync`: sync silently rewrites a stale lock, which is
      # why drift never failed a build. A pip-ecosystem Dependabot PR edited
      # pyproject.toml without the lock and merged green (#76).
      - name: Verify uv.lock matches pyproject.toml
        run: make lock-check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff check + format check)
        run: make lint

      - name: Type check (ty)
        # Search paths are derived from the workspace members in the Makefile,
        # so a new agent is picked up automatically — no CI edit needed.
        run: make type-check

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Gates on known CVEs introduced by dependency changes (AEP-014). The
    # action is diff-based: PR events diff base...head automatically; push
    # events diff the previous main commit (github.event.before) against the
    # pushed one. workflow_dispatch has no diff to compare, so it skips.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Triaged advisories with NO upstream fix. Unlike Trivy this action
          # has no `ignore-unfixed`, so an unfixable finding on a transitive
          # dependency would block every lockfile change that touches it.
          # Keep this list short and delete an entry as soon as a patched
          # release exists (`uv lock --upgrade-package <name>` then clears it).
          #
          # GHSA-8mgp-746c-j5xp — nltk <= 3.10.3 (no patched version as of
          # 2026-09-11). nltk is transitive via google-adk[eval] → rouge-score
          # and is used only for eval scoring; Orrery never calls its
          # model-artifact download/load APIs, which is where the path-escape
          # lives. Re-check https://github.com/advisories/GHSA-8mgp-746c-j5xp.
          allow-ghsas: GHSA-8mgp-746c-j5xp

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      - name: Bandit check
        run: uvx --python 3.14 bandit -r agents/ core/ -ll

      # CycloneDX SBOM of the locked Python graph (AEP-014) — kept as a build
      # artifact so any CI run's dependency set can be audited after the fact.
      # Releases attach the same SBOM as a release asset.
      - name: Generate Python SBOM (CycloneDX)
        run: |
          uv export --frozen --no-dev --format requirements-txt -o requirements-sbom.txt
          uvx cyclonedx-py requirements requirements-sbom.txt -o sbom-python.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: sbom-python.cdx.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Render the Helm chart against a K8s version that satisfies its
          # kubeVersion (>=1.25.0); the Trivy default of 1.20.0 skips the
          # chart, leaving it unscanned for misconfigurations.
          TRIVY_HELM_KUBE_VERSION: "1.28.0"
        with:
          trivyignores: .trivyignore.yaml
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: make test

  web:
    name: Web Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Check (lint + format + typecheck + test + build)
        # Same target contributors run locally — the web gate is defined once.
        run: make test-web

      # `--omit=dev` deliberately: the console ships a browser bundle, so only
      # production dependencies reach a user. Auditing dev tooling as well
      # currently reports 9 high findings (eslint, vitest, postcss, and their
      # transitive deps) — none of which are shipped — and a gate that is red
      # on arrival gets switched off within a week. This form is green today
      # and fails only when something reaching users is vulnerable.
      - name: Audit shipped dependencies
        run: cd web && npm audit --omit=dev --audit-level=high

  eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: make eval
