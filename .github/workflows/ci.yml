name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; a job that needs more asks for it. Without this block
# every job inherits the repository's default token scope, which may be write.
permissions:
  contents: read

# A new push to a PR supersedes the run on its previous head — cancel it rather
# than queue behind it. Pushes to main are never cancelled: each one is a
# distinct commit whose result is the record of what landed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit SHA, with the release in a trailing
# comment that Dependabot keeps current. A tag is mutable — whoever controls the
# action's repository can repoint it — and these jobs run with this repo's token.
env:
  # Tools run through `uvx` are pinned for the same reason the lockfile exists:
  # an unpinned scanner can change verdicts (or be swapped) between two runs.
  BANDIT_VERSION: "1.9.4"
  CYCLONEDX_BOM_VERSION: "7.5.0"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Must run BEFORE `uv sync`: sync silently rewrites a stale lock, which is
      # why drift never failed a build. A pip-ecosystem Dependabot PR edited
      # pyproject.toml without the lock and merged green (#76).
      - name: Verify uv.lock matches pyproject.toml
        run: make lock-check

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint (ruff check + format check)
        run: make lint

      - name: Type check (ty)
        # Search paths are derived from the workspace members in the Makefile,
        # so a new agent is picked up automatically — no CI edit needed.
        run: make type-check

  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      # actionlint catches broken expressions and shell; zizmor catches the
      # security mistakes (template injection, spoofable bot checks, unpinned
      # actions, over-broad tokens) that a working workflow can still carry.
      - name: actionlint + zizmor
        run: make lint-workflows

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gates on known CVEs introduced by dependency changes (AEP-014). The
    # action is diff-based: PR events diff base...head automatically; push
    # events diff the previous main commit (github.event.before) against the
    # pushed one. workflow_dispatch has no diff to compare, so it skips.
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Triaged advisories with NO upstream fix. Unlike Trivy this action
          # has no `ignore-unfixed`, so an unfixable finding on a transitive
          # dependency would block every lockfile change that touches it.
          # Keep this list short and delete an entry as soon as a patched
          # release exists (`uv lock --upgrade-package <name>` then clears it).
          #
          # GHSA-8mgp-746c-j5xp — nltk <= 3.10.3 (no patched version as of
          # 2026-09-11). nltk is transitive via google-adk[eval] → rouge-score
          # and is used only for eval scoring; Orrery never calls its
          # model-artifact download/load APIs, which is where the path-escape
          # lives. Re-check https://github.com/advisories/GHSA-8mgp-746c-j5xp.
          allow-ghsas: GHSA-8mgp-746c-j5xp

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bandit check
        run: uvx --python 3.14 "bandit==${BANDIT_VERSION}" -r agents/ core/ -ll

      # CycloneDX SBOM of the locked Python graph (AEP-014) — kept as a build
      # artifact so any CI run's dependency set can be audited after the fact.
      # Releases attach the same SBOM as a release asset.
      - name: Generate Python SBOM (CycloneDX)
        run: |
          uv export --frozen --no-dev --format requirements-txt -o requirements-sbom.txt
          uvx --from "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" cyclonedx-py \
            requirements requirements-sbom.txt -o sbom-python.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.cdx.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Render the Helm chart against a K8s version that satisfies its
          # kubeVersion (>=1.25.0); the Trivy default of 1.20.0 skips the
          # chart, leaving it unscanned for misconfigurations.
          TRIVY_HELM_KUBE_VERSION: "1.28.0"
        with:
          trivyignores: .trivyignore.yaml
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: make test

  web:
    name: Web Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # --ignore-scripts: no dependency gets to run install hooks on the
        # runner. Nothing in the console's tree needs one to build.
        run: cd web && npm ci --ignore-scripts

      - name: Check (lint + format + typecheck + test + build)
        # Same target contributors run locally — the web gate is defined once.
        run: make test-web

      # `--omit=dev` deliberately: the console ships a browser bundle, so only
      # production dependencies reach a user. Auditing dev tooling as well
      # currently reports 9 high findings (eslint, vitest, postcss, and their
      # transitive deps) — none of which are shipped — and a gate that is red
      # on arrival gets switched off within a week. This form is green today
      # and fails only when something reaching users is vulnerable.
      - name: Audit shipped dependencies
        run: cd web && npm audit --omit=dev --audit-level=high

  eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: make eval
