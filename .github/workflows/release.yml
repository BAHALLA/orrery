name: Release & Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Read-only by default; each job below asks for exactly what it uses. A
# workflow-wide write grant handed `contents: write` to the lint/test and Helm
# jobs, which never need it — and to every action they run.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CYCLONEDX_BOM_VERSION: "7.5.0"

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    # Only gate releases here (tag pushes). Pushes to main are already covered
    # by ci.yml, so running this on every main commit would duplicate the gate.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Reuse the Makefile targets so the quality gate stays defined in one place
      # (matches ci.yml; ty search paths are derived from the workspace members).
      - name: Lint & type check
        run: make lint type-check

      - name: Test
        run: make test

  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write         # push to GHCR
      id-token: write         # cosign keyless signing
      security-events: write  # Trivy SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=orrery-assistant
            org.opencontainers.image.description=AI-powered DevOps/SRE agent platform
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Busts the Dockerfile's `apt-get upgrade` layer once a day; without it
      # the GHA cache replays a stale upgrade and new Debian fixes never land.
      - name: Security-updates cache key
        id: secdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SECURITY_UPDATES_DATE=${{ steps.secdate.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The installer's default (v3.0.6) only moves with its own releases.
          cosign-release: v3.1.4

      - name: Sign the images
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # TAGS is newline-separated (metadata-action); an array keeps each
          # ref one argument without relying on unquoted word splitting.
          images=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && images+=("${tag}@${DIGEST}")
          done <<< "${TAGS}"
          # Sigstore (Fulcio/Rekor) intermittently drops the stream with an
          # HTTP/2 INTERNAL_ERROR; signing is idempotent, so retry with backoff
          # rather than failing a release on a transient upstream blip.
          for attempt in 1 2 3 4; do
            cosign sign --yes "${images[@]}" && exit 0
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::cosign sign failed after 4 attempts"
          exit 1

      # Scan the pushed image (AEP-014). Gates the release jobs downstream on
      # HIGH/CRITICAL fixable CVEs and feeds GitHub code scanning either way.
      # GHCR paths are lowercase (metadata-action lowercases when tagging).
      - name: Resolve lowercase image ref
        id: imageref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ref=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${DIGEST}" >> "$GITHUB_OUTPUT"

      # The shared gate is referenced as `./.github/actions/...` after checkout.
      # zizmor suggests GitHub's newer `$/` self-repository syntax; kept on `./`
      # until the pinned actionlint understands it (hence the inline ignores).
      #
      # Two passes: the table run is the gate and prints the findings in the
      # job log (a SARIF-only gate fails without showing what it found); the
      # SARIF run reuses the cached scan and feeds code scanning either way.
      # Thresholds and ignores live in the shared action, which image-scan.yml
      # uses too.
      - name: Trivy image scan (gate)
        id: trivy_gate
        uses: ./.github/actions/trivy-image-gate  # zizmor: ignore[self-repository]
        with:
          image-ref: ${{ steps.imageref.outputs.ref }}

      # The index resolves to the runner's platform, so arm64 is gated
      # explicitly: an arm64-only package or binary would pass otherwise.
      - name: Trivy image scan (gate, arm64)
        if: always() && steps.trivy_gate.outcome != 'skipped'
        uses: ./.github/actions/trivy-image-gate  # zizmor: ignore[self-repository]
        with:
          image-ref: ${{ steps.imageref.outputs.ref }}
          platform: linux/arm64
          skip-setup-trivy: "true"

      # amd64 only: arm64 findings fail the gate above and show in its log,
      # but don't reach code scanning.
      - name: Trivy image scan (SARIF for code scanning)
        # always() so findings reach code scanning when the gate fails — but
        # only if the gate ran: it installs trivy, which skip-setup-trivy reuses.
        if: always() && steps.trivy_gate.outcome != 'skipped'
        uses: ./.github/actions/trivy-image-gate  # zizmor: ignore[self-repository]
        with:
          image-ref: ${{ steps.imageref.outputs.ref }}
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif
          skip-setup-trivy: "true"

      - name: Upload Trivy SARIF to code scanning
        if: always() && steps.trivy_gate.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: container-image

      - name: Image digest
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
    outputs:
      digest: ${{ steps.build.outputs.digest }}

  helm-lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.0

      - name: Lint chart
        run: helm lint deploy/helm/orrery-assistant

      - name: Template chart (smoke test)
        run: helm template test deploy/helm/orrery-assistant > /tmp/rendered.yaml

      - name: Validate rendered manifests (kubeconform)
        env:
          KUBECONFORM_VERSION: v0.8.0
          # SHA256 of kubeconform-linux-amd64.tar.gz for the pinned version
          # (from the release CHECKSUMS). Bump both together on upgrade.
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          tarball=kubeconform.tar.gz
          curl -sL --fail -o "$tarball" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$tarball" kubeconform
          kubeconform -summary -strict -ignore-missing-schemas \
            -kubernetes-version 1.28.0 /tmp/rendered.yaml

  release:
    name: GitHub Release
    needs: [ci, build-and-push, helm-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # CycloneDX SBOM of the Python dependency graph (AEP-014). More valuable
      # than the OS-layer SBOM buildx embeds: the primary attack surface here
      # is the LLM client libraries, not the Debian base. Published as a
      # release asset so downstream consumers can diff/audit it. The extras are
      # read from the Dockerfile's `uv sync` so the SBOM lists what the image
      # ships (mcp, a2a-sdk, pyjwt, ...), not just the base graph.
      - name: Generate Python SBOM (CycloneDX)
        run: |
          # Join `\` continuations first, so a wrapped `uv sync` keeps all its
          # extras; `server` must be among them or the parse went wrong.
          mapfile -t extras < <(sed -e ':a' -e '/\\$/N; s/\\\n//; ta' Dockerfile \
            | grep -m1 'uv sync --no-dev' \
            | grep -oE -- '--extra [a-z0-9-]+' | tr ' ' '\n')
          if [[ " ${extras[*]} " != *" server "* ]]; then
            echo "::error::could not read the image's extras from the Dockerfile's uv sync"
            exit 1
          fi
          uv export --frozen --no-dev "${extras[@]}" --format requirements-txt \
            -o requirements-sbom.txt
          uvx --from "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" cyclonedx-py \
            requirements requirements-sbom.txt -o sbom-python.cdx.json

      - name: Build release notes
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="${VERSION}"
          # GHCR requires a lowercase repository path (the GitHub owner may be
          # mixed-case; docker/metadata-action lowercases it when tagging, so
          # the published image lives at the lowercase path). The image tags
          # carry the bare semver — metadata-action's `pattern={{version}}`
          # strips the tag's leading `v` — so reference `:X.Y.Z`, not `:vX.Y.Z`.
          IMAGE_URL="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"

          # Extract this version's section from the changelog.
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          # Append Docker image info (body_path so it actually renders — the
          # previous inline "$(cat ...)" was never shell-evaluated by the action).
          {
            echo ""
            echo "## 🐳 Docker Images"
            echo ""
            echo "Available on GitHub Container Registry:"
            echo "- \`${IMAGE_URL}:${version}\`"
            echo "- \`${IMAGE_URL}:latest\`"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE_URL}:${version}"
            echo "\`\`\`"
            echo ""
            echo "### Multi-arch digest"
            echo "\`${DIGEST}\`"
          } >> release_notes.md

          # Asset file with the pinned digests.
          echo "${IMAGE_URL}:${version}@${DIGEST}" > docker-images.txt
          echo "${IMAGE_URL}:latest@${DIGEST}" >> docker-images.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            docker-images.txt
            sbom-python.cdx.json
          draft: false
          prerelease: false
          generate_release_notes: false
