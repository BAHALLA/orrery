version: 2
updates:
  # `uv`, not `pip`: this workspace is uv-managed (pyproject.toml + a tracked
  # uv.lock). The pip ecosystem only ever edited pyproject.toml, so every Python
  # update landed with a lockfile still recording the old constraint — #76 merged
  # green that way, and `uv sync` hid it by rewriting the lock in the runner. The
  # uv ecosystem knows about uv.lock. `make lock-check` in CI is the backstop,
  # because Dependabot's uv support can still leave one file behind.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per week for routine minor/patch bumps instead of one per package
    # (a single week once produced nine). Majors stay individual so a breaking
    # change is reviewed on its own. `google-adk` is kept separate at any level:
    # it is the framework, and its release notes deserve a dedicated read.
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "google-adk"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # The web console is a separate toolchain outside the uv workspace, so the
  # uv ecosystem above never sees it. Without this its dependencies — React,
  # the OIDC client that handles sign-in — get no security updates at all.
  #
  # The groups below exist because npm peer ranges make some packages
  # un-upgradable alone: a lone `vite` bump hits `@vitejs/plugin-react`'s peer
  # range and dies at `npm ci` with ERESOLVE, and so does a lone `react-dom` or
  # `@types/react-dom`. Three of the four open Dependabot PRs failed exactly this
  # way — the update was fine, the *partition* was wrong. Grouping makes
  # Dependabot propose the coherent set in one PR that can actually install.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      # react-dom's peer is react; @types/react-dom's peer is @types/react.
      # All four move together or none do.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vitejs/plugin-react pins a vite major in its peer range; vitest and its
      # coverage provider track vite too.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/vite"
          - "vitest"
          - "@vitest/*"
      # typescript-eslint's peer range gates which TypeScript major is
      # installable, so a TS major needs its plugin to have caught up first.
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Everything else that is test-only, batched to keep the PR count sane.
      testing:
        patterns:
          - "@testing-library/*"
          - "jsdom"
    ignore:
      # HOLD — remove this entry when typescript-eslint ships a release whose
      # `typescript` peer range admits 7.x. Check with:
      #     npm view typescript-eslint@latest peerDependencies.typescript
      #
      # TypeScript 7 (the native port) cannot be installed here at all. Latest
      # (8.65.0) and canary (8.65.1-alpha.7) both peer `>=4.8.4 <6.1.0`, and the
      # package carries a hard runtime guard — "typescript-eslint does not support
      # TS 7.0" — so even --legacy-peer-deps only moves the failure from install
      # to lint. There is no 6.x stable to step through either; the registry goes
      # 5.9.3 straight to 7.0.x.
      #
      # Grouping cannot solve this: a group only bundles updates that exist, and
      # no compatible typescript-eslint exists. So Dependabot rebuilt the same
      # unmergeable PR every week (#70, #77), each one now sitting BLOCKED against
      # the required checks. The hold is on the *major* only — 5.x patches and
      # minors still flow.
      #
      # The console itself is already TS 7-clean: `tsc --noEmit` under 7.0.2
      # reports zero errors. This is a toolchain hold, not a code problem.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
