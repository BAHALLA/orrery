# Prometheus alerting rules.
#
# Every rule carries a `runbook_url` annotation (AEP-017). An alert without one
# is an alert that becomes a source-code archaeology session at 03:00, so the
# annotation is mandatory — see docs/runbooks/template.md when adding a rule.
#
# Runbook URLs point at the published docs site rather than the repository, so
# the page renders with its cross-links intact.
groups:
  - name: orrery_platform
    rules:
      # ── Availability ──────────────────────────────────────────────
      - alert: OrreryAgentDown
        expr: up{job="agents"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Orrery instance {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has failed scraping for 2 minutes. Chat transports and the web console are unavailable."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/agents-unavailable/"

      # The metrics endpoint keeps serving while the session store is gone, so
      # database failures surface as tool errors rather than a down target.
      - alert: OrreryDatabaseUnreachable
        expr: increase(orrery_tool_errors_total{error_type=~"DatabaseUnavailableError|OperationalError|InterfaceError"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Orrery cannot reach its session database"
          description: "Session, memory, confirmation and idempotency stores share one PostgreSQL; they degrade together."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/session-db-unreachable/"

      # ── Autonomous remediation ────────────────────────────────────
      # verify_route caps a single sweep at 3 act->verify cycles, so a sustained
      # rate above that means sweeps are being re-triggered — the cap is
      # per-run, not across runs. This is the one path with no human in the
      # conversation, hence critical rather than warning.
      - alert: OrreryRemediationStorm
        expr: sum(increase(orrery_tool_calls_total{agent="remediation_actor"}[15m])) > 6
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Remediation actor has taken {{ $value }} actions in 15m"
          description: "A single sweep is capped at 3 actions. More means repeated sweeps, a verifier that cannot observe its own effect, or autonomy above L2 on an unattended run."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/remediation-loop-storm/"

      # ── Tool health ───────────────────────────────────────────────
      - alert: OrreryCircuitBreakerOpen
        expr: orrery_circuit_breaker_state == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker open for {{ $labels.tool }}"
          description: "5 consecutive failures opened the breaker. Most often the monitored backend is genuinely down — the breaker is protecting it."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/circuit-breaker-open/"

      - alert: OrreryHighToolErrorRate
        expr: |
          sum by (agent, tool) (rate(orrery_tool_calls_total{status="error"}[5m]))
            /
          clamp_min(sum by (agent, tool) (rate(orrery_tool_calls_total[5m])), 0.001)
            > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.agent }}/{{ $labels.tool }} error rate above 10%"
          description: "Check the error_type label: connection errors mean the backend is unhealthy, ValidationError means the model is mis-calling the tool."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/high-tool-error-rate/"

      # ── Cost ──────────────────────────────────────────────────────
      # Input tokens rising while tool calls stay flat is the context-bloat
      # signature — the runbook separates that from genuine incident load.
      - alert: OrreryHighTokenBurn
        expr: sum(rate(orrery_llm_tokens_total[15m])) * 900 > 2000000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "LLM token burn above 2M per 15 minutes"
          description: "A major incident legitimately costs more. Compare token growth against tool-call growth before treating this as a fault."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/high-llm-spend/"

      # ── Content safety ────────────────────────────────────────────
      # Split by direction, because the two halves have different owners and
      # different responses — summing them would be meaningless.
      #
      # Indirect: instruction-like text arrived inside a tool result and was
      # neutralized in place. The control worked; the finding is that
      # attacker-reachable content is sitting in the monitored infrastructure.
      # Warning, because the agent was never at risk of acting on it.
      - alert: OrreryIndirectInjectionDetected
        expr: sum by (source) (increase(orrery_safety_screen_total{direction="indirect"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Instruction-like text neutralized in {{ $labels.source }} results"
          description: "{{ $value }} span(s) in 15m. Investigate why that text is in the infrastructure, not the screen that caught it."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/prompt-injection-detected/"

      # Direct: a user message was refused before it reached a tool or cost a
      # token. A single one is usually curiosity; a sustained rate is someone
      # working at it, which is why this one has a threshold and a `for`.
      - alert: OrreryDirectInjectionAttempts
        expr: increase(orrery_safety_screen_total{direction="direct"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repeated prompt-injection attempts against the agent"
          description: "{{ $value }} user messages blocked in 15m. Identify the caller from the audit trail."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/prompt-injection-detected/"

      # ── Approval integrity (AEP-024) ──────────────────────────────
      # The one alert in this file about a *person* rather than a system.
      # Someone other than the requester attempting to approve a guarded action
      # is either a confused operator or an attempt to escalate, and both are
      # worth waking someone for. The gate already refused it — this says it
      # happened, which is what the platform previously could not.
      - alert: OrreryUnauthorizedApprovalAttempt
        expr: increase(orrery_confirmations_refused_total{reason="not_requester"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Non-requester tried to approve {{ $labels.tool }}"
          description: "The confirmation gate refused it. Identify the actor from the confirmation_refused audit entry before anything else."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/unauthorized-approval-attempt/"

      # No verified identity to attribute an approval to. A sustained rate means
      # a transport is not stamping the actor — guarded actions become
      # unapprovable, and the platform silently stops being able to remediate.
      - alert: OrreryUnattributableApprovals
        expr: increase(orrery_confirmations_refused_total{reason="unknown_requester"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Approvals cannot be attributed to a verified caller"
          description: "A transport is likely not stamping the turn's actor. Guarded tools cannot be approved at all in this state."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/unauthorized-approval-attempt/"

  - name: demo_alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} is down"
          description: "{{ $labels.job }}/{{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/agents-unavailable/"

      - alert: HighPrometheusScrapeLatency
        expr: scrape_duration_seconds > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scrape latency on {{ $labels.instance }}"
          description: "Scrape duration is {{ $value }}s on {{ $labels.instance }}."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/"

  # Alerts about the *monitored* infrastructure. Orrery reporting these is
  # Orrery working; the runbook index explains that distinction, and the
  # specific remediation belongs to whoever owns Kafka.
  - name: kafka_alerts
    rules:
      - alert: KafkaConsumerGroupLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} has high lag"
          description: "Lag is {{ $value }} on topic {{ $labels.topic }}."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/"

      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_topic_partition_under_replicated_partition > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Under-replicated partitions on {{ $labels.topic }}"
          description: "Partition {{ $labels.partition }} of topic {{ $labels.topic }} is under-replicated."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/"

  # Infrastructure Orrery watches (not Orrery itself). Lag comes from
  # kafka-exporter in the local stack; in production, point the same expression
  # at whatever exports kafka_consumergroup_lag.
  - name: kafka
    rules:
      - alert: KafkaConsumerGroupLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is {{ $value }} messages behind on {{ $labels.topic }}"
          description: "Lag above 1000 for 30s. Consumers are down, stuck, or slower than producers."
          runbook_url: "https://bahalla.github.io/orrery/runbooks/kafka-consumer-lag/"

