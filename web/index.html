<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Orrery — web console for DevOps/SRE agents" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The UI face, fetched alongside the CSS instead of after it is parsed. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Orrery Console</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime settings (OIDC SSO) from the server; must run before the app. -->
    <script src="/console-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
