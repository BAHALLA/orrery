## Default values for orrery-assistant.
## Override with `helm install ... -f my-values.yaml` or `--set key=value`.

image:
  repository: ghcr.io/bahalla/orrery
  tag: ""  # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Number of replicas. Ignored when autoscaling.enabled is true.
replicaCount: 2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Main ADK web command. Override to run alternate entry points.
command:
  - adk
  - web
  - --host
  - 0.0.0.0
  - --port
  - "8000"
  - agents/orrery-assistant

service:
  type: ClusterIP
  httpPort: 8000
  metricsPort: 9100

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: agents.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# SIGTERM handling — give in-flight LLM calls time to finish.
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 10

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 30
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 12

## ── Application config ──────────────────────────────────────────────
## Values placed under `config` are rendered into a ConfigMap and mounted
## via envFrom. Secret keys (API tokens, DATABASE_URL) MUST go under
## `secrets` or be provided out-of-band via `existingSecret`.
config:
  ## Pending approvals for guarded tools (all transports share this store)
  ## are process-local by default ("memory"). When this deployment serves the
  ## HTTP front door with replicaCount > 1 (or autoscaling), set "postgres"
  ## (needs DATABASE_URL) so an approval received on one replica resolves a
  ## pending raised on another. The pubsubWorker template sets the same env
  ## var from pubsubWorker.confirmation.backend.
  # ORRERY_CONFIRMATION_BACKEND: postgres
  MODEL_PROVIDER: gemini
  MODEL_NAME: gemini-2.0-flash
  GEMINI_MODEL_VERSION: gemini-2.0-flash
  GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
  ENABLE_METRICS_SERVER: "true"
  HEALTH_PORT: "8080"
  METRICS_PORT: "9100"
  LOG_LEVEL: INFO
  CONTEXT_CACHE_MIN_LENGTH: "2048"
  CONTEXT_CACHE_TTL_SECONDS: "600"
  CONTEXT_CACHE_INTERVALS: "10"
  KAFKA_BOOTSTRAP_SERVERS: kafka.data.svc.cluster.local:9092
  ## Secured clusters (validated at startup; see agents/kafka-health/README.md):
  # KAFKA_SECURITY_PROTOCOL: SASL_SSL
  # KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  # KAFKA_SASL_USERNAME: orrery
  # KAFKA_SSL_CA_LOCATION: /etc/kafka/ca/ca.crt   # mount via extraVolumes (below)
  PROMETHEUS_URL: http://prometheus.observability.svc.cluster.local:9090
  LOKI_URL: http://loki.observability.svc.cluster.local:3100
  ALERTMANAGER_URL: http://alertmanager.observability.svc.cluster.local:9093
  # ── Elasticsearch ──
  ELASTICSEARCH_URL: http://elasticsearch.elastic-system.svc.cluster.local:9200
  ELASTICSEARCH_VERIFY_CERTS: "true"
  ELASTICSEARCH_HTTP_TIMEOUT: "15"
  # ── Knowledge retrieval (AEP-025, opt-in) ──
  # Off until ORRERY_KNOWLEDGE_BACKEND is set; the agent then gains a
  # `search_knowledge` tool over runbooks/postmortems/ADRs you have indexed.
  # Indexing is a build-time action (`make knowledge-sync`), never lazy at
  # request time — run it from CI or a CronJob against the same backend.
  # Only index what every `viewer` may read: retrieval is viewer-level and
  # not ACL-aware. Full reference: https://bahalla.github.io/orrery/knowledge/
  #
  # elasticsearch — BM25 over the cluster below. Deliberately its own
  # KNOWLEDGE_ES_* family, so the index cluster can differ from the one the
  # elasticsearch agent diagnoses.
  # ORRERY_KNOWLEDGE_BACKEND: elasticsearch
  # KNOWLEDGE_ES_URL: http://elasticsearch.elastic-system.svc.cluster.local:9200
  # KNOWLEDGE_ES_INDEX: orrery-knowledge
  #
  # pgvector — hybrid semantic + lexical ranking in Postgres. Defaults to
  # DATABASE_URL (the server must have the `vector` extension); needs an
  # embedding provider, which defaults to MODEL_PROVIDER.
  # ORRERY_KNOWLEDGE_BACKEND: pgvector
  # KNOWLEDGE_PG_TABLE: orrery_knowledge_chunks
  # EMBEDDING_PROVIDER: gemini
  # EMBEDDING_MODEL: ""            # provider default when empty
  #
  # ORRERY_KNOWLEDGE_TOP_K: "6"    # passages per query
  # ── Google Chat Bot (HTTP transport) ──
  GOOGLE_CHAT_AUDIENCE: ""
  GOOGLE_CHAT_IDENTITIES: "chat@system.gserviceaccount.com"
  GOOGLE_CHAT_ADMIN_EMAILS: ""
  GOOGLE_CHAT_OPERATOR_EMAILS: ""
  GOOGLE_CHAT_ASYNC_RESPONSE: "true"
  GOOGLE_CHAT_SERVICE_ACCOUNT_FILE: ""
  # ── Google Chat Bot (Pub/Sub transport) ──
  # Only consumed by the pubsubWorker Deployment. AUDIENCE / VERIFY_TOKEN
  # are ignored in this mode; Pub/Sub IAM is the auth boundary.
  GOOGLE_CHAT_PUBSUB_SUBSCRIPTION: ""
  GOOGLE_CHAT_PUBSUB_PROJECT: ""
  GOOGLE_CHAT_PUBSUB_MAX_MESSAGES: "4"
  GOOGLE_CHAT_PUBSUB_HANDLER_TIMEOUT_SECONDS: "600"

## Secret values. Leave empty and set `existingSecret` to use a Secret
## managed out-of-band (External Secrets Operator, Sealed Secrets, Vault).
secrets:
  # GOOGLE_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
  # KAFKA_SASL_PASSWORD: ""
  # KAFKA_SASL_OAUTHBEARER_CLIENT_SECRET: ""
  # ELASTICSEARCH_USERNAME: ""
  # ELASTICSEARCH_PASSWORD: ""
  # ELASTICSEARCH_API_KEY: ""
  # ── Knowledge retrieval (AEP-025) ──
  # KNOWLEDGE_ES_API_KEY: ""        # or KNOWLEDGE_ES_USERNAME / KNOWLEDGE_ES_PASSWORD
  # KNOWLEDGE_PG_URL: ""            # only if the index lives outside DATABASE_URL
  # KNOWLEDGE_CONFLUENCE_API_TOKEN: ""  # with KNOWLEDGE_CONFLUENCE_URL/_SPACES/_EMAIL in config
  # DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/agents"
  # JWT_SECRET: ""  # only used when auth.enabled and auth.algorithm=HS256

## Name of a pre-existing Secret. If set, Helm will NOT manage secrets —
## keys are mounted via envFrom.secretRef. This is the recommended path
## for production.
existingSecret: ""

## ── Authentication (AEP-013) ───────────────────────────────────────
## JWT bearer-token verification for the HTTP front door. Required for
## any deployment that exposes orrery_core.server over HTTP — without it
## the RBAC roles encoded in the JWT are not verifiable and `adk web`
## style entry points trust the caller's self-declared identity.
##
## The Slack and Google Chat transports authenticate at their own layer
## (Slack signing secret, Google OIDC) and ignore these settings.
##
## When enabled, the chart writes AUTH_ENABLED + JWT_* into the
## ConfigMap. JWT_SECRET is treated as a secret — set it under `secrets`
## (HS256) or omit it entirely and use `secretsVolume` for a mounted
## Kubernetes Secret instead.
auth:
  enabled: false
  ## "HS256" — symmetric, requires JWT_SECRET (under `secrets`).
  ## "RS256" / "ES256" — asymmetric, requires JWKS URL (IdP-fronted).
  algorithm: HS256
  ## JWKS endpoint for asymmetric algorithms. Common values:
  ##   Auth0    https://YOUR_TENANT.auth0.com/.well-known/jwks.json
  ##   Keycloak https://KC/realms/REALM/protocol/openid-connect/certs
  ##   Okta     https://YOUR_ORG.okta.com/oauth2/default/v1/keys
  ##   Google   https://www.googleapis.com/oauth2/v3/certs
  jwksUrl: ""
  ## Bind tokens to this service. Strongly recommended in production —
  ## prevents tokens minted for another audience from being accepted.
  audience: ""
  issuer: ""
  ## Custom claim that carries the role list. Auth0 RBAC typically uses
  ## "https://YOUR_API/roles". Defaults to "roles" for HS256 / Keycloak.
  roleClaim: roles
  ## Clock-skew tolerance for exp/nbf validation.
  leewaySeconds: 30
  ## CORS allowlist for browser clients of POST /chat (comma-separated).
  corsOrigins: ""

## ── Mounted-secrets volume (ORRERY_SECRETS_DIR) ────────────────────
## Mount a Kubernetes Secret as files under /var/run/secrets/orrery. At
## startup each file named like an env var (JWT_SECRET, DATABASE_URL,
## GOOGLE_API_KEY, ...) is loaded into the process environment, overriding
## envFrom, so the values never appear in the pod spec. Recommended over
## envFrom.secretRef for sensitive secrets in compliance-bound deployments.
## Restart the pods after rotating a secret.
##
## When enabled, the chart sets ORRERY_SECRETS_DIR on the container and
## mounts `secretName` at `mountPath`. The Secret must be created out of
## band (External Secrets Operator, Sealed Secrets, Vault Agent Injector).
secretsVolume:
  enabled: false
  secretName: orrery-secrets-volume
  mountPath: /var/run/secrets/orrery

## Extra volumes for files a setting points at by path, e.g. the CA and
## client certificate of a TLS Kafka listener (KAFKA_SSL_*_LOCATION).
## Mounted read-only by convention; the root filesystem stays read-only.
extraVolumes: []
#  - name: kafka-ca
#    secret:
#      secretName: my-cluster-cluster-ca-cert   # Strimzi cluster CA
#  - name: kafka-user
#    secret:
#      secretName: orrery                       # Strimzi KafkaUser (type: tls)
extraVolumeMounts: []
#  - name: kafka-ca
#    mountPath: /etc/kafka/ca
#    readOnly: true
#  - name: kafka-user
#    mountPath: /etc/kafka/user
#    readOnly: true

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: observability

## ── Google Chat Pub/Sub worker ─────────────────────────────────────
## Optional second Deployment that runs `python -m google_chat_bot.pubsub_worker`.
## Use this when the Chat bot lives on a private GKE cluster that Google Chat
## cannot reach via HTTP. The worker is outbound-only — no Service or Ingress.
## See agents/google-chat-bot/README.md for the Pub/Sub transport overview.
pubsubWorker:
  enabled: false
  replicaCount: 1
  command:
    - python
    - -m
    - google_chat_bot.pubsub_worker
  ## Idempotency guard. Pub/Sub is at-least-once, so a redelivered event would
  ## double-run @destructive tools. The worker claims each event id before
  ## dispatching and drops duplicates.
  ##   backend "memory"   — process-local; correct ONLY for a single replica.
  ##   backend "postgres" — shared across replicas via the platform DATABASE_URL;
  ##                        REQUIRED whenever replicaCount > 1 or autoscaling is on.
  ## The chart refuses to render a multi-replica worker on the memory backend.
  idempotency:
    backend: memory

  ## Confirmation store (pending human approvals for guarded tools). Same rule
  ## as idempotency: "memory" is process-local (single replica only — and the
  ## pending dies with the pod); "postgres" shares the approval handshake across
  ## replicas via DATABASE_URL and survives restarts. The chart refuses to
  ## render a multi-replica worker on the memory backend.
  confirmation:
    backend: memory
    ttlSeconds: 3600
  ## Backlog-based autoscaling. CPU/memory HPAs are useless here (the worker is
  ## I/O-bound on LLM calls); the meaningful signal is the subscription's
  ## num_undelivered_messages. Requires the GKE custom-metrics (Stackdriver)
  ## adapter. Set idempotency.backend=postgres before enabling.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    # Target undelivered messages per pod; HPA scales out when the backlog
    # per replica exceeds this.
    targetBacklogPerPod: 10
  serviceAccount:
    create: true
    # On GKE, paste the `gsa_email` output from deploy/terraform/google-chat-bot
    # here to enable Workload Identity:
    #   iam.gke.io/gcp-service-account: your-chat-bot-sa@your-project-id.iam.gserviceaccount.com
    annotations: {}
    name: ""
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ## Health HTTP server inside the worker. Exposes /healthz and /readyz;
  ## readiness flips to 503 if the Pub/Sub streaming-pull future dies.
  healthPort: 8080
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
  ## PodDisruptionBudget for the worker. Replica count defaults to 1; bump
  ## replicaCount to 2+ before enabling this to avoid blocking node drains.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orrery-assistant
          topologyKey: kubernetes.io/hostname
