{{- /*
  Safety guard, same rule as the Pub/Sub worker's: per-process state cannot be
  shared across pods. With more than one replica, a conversation's next turn
  and a human's approval can land on a pod that has never seen them.
*/}}
{{- if and (include "orrery-assistant.multiReplica" .) (ne (include "orrery-assistant.confirmationBackend" .) "postgres") }}
{{- fail "More than one replica (replicaCount > 1 or autoscaling.enabled) needs shared state: set persistence.backend=postgres and provide DATABASE_URL. With the in-memory backend, conversations lose their context and approvals are not found when requests land on different pods." }}
{{- end }}
{{- /*
  An unauthenticated API behind a public ingress is anyone's viewer session,
  and everyone behind one NAT shares its conversation list. Require an
  explicit opt-in.
*/}}
{{- if and .Values.ingress.enabled (not .Values.auth.enabled) (not .Values.auth.allowAnonymous) }}
{{- fail "ingress.enabled exposes the API, but auth.enabled is false. Enable auth (auth.enabled=true with JWT settings), or set auth.allowAnonymous=true to accept anonymous viewer access deliberately." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orrery-assistant.fullname" . }}
  labels:
    {{- include "orrery-assistant.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "orrery-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orrery-assistant.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and (not .Values.existingSecret) .Values.secrets }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "orrery-assistant.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "orrery-assistant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.command | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "orrery-assistant.fullname" . }}
            - secretRef:
                name: {{ include "orrery-assistant.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/appuser/.cache
            {{- if .Values.secretsVolume.enabled }}
            - name: orrery-secrets
              mountPath: {{ .Values.secretsVolume.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        {{- if .Values.secretsVolume.enabled }}
        - name: orrery-secrets
          secret:
            secretName: {{ .Values.secretsVolume.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
