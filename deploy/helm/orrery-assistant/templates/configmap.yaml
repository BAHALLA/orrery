apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orrery-assistant.fullname" . }}
  labels:
    {{- include "orrery-assistant.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not (hasKey .Values.config "ORRERY_CONFIRMATION_BACKEND") }}
  ORRERY_CONFIRMATION_BACKEND: {{ .Values.persistence.backend | quote }}
  {{- end }}
  {{- if include "orrery-assistant.multiReplica" . }}
  # Read by the server at startup: refuse to run on per-process state.
  ORRERY_MULTI_REPLICA: "true"
  {{- end }}
  {{- if .Values.auth.enabled }}
  AUTH_ENABLED: "true"
  JWT_ALGORITHM: {{ .Values.auth.algorithm | quote }}
  {{- with .Values.auth.jwksUrl }}
  JWT_JWKS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.audience }}
  JWT_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.issuer }}
  JWT_ISSUER: {{ . | quote }}
  {{- end }}
  JWT_ROLE_CLAIM: {{ .Values.auth.roleClaim | quote }}
  JWT_LEEWAY_SECONDS: {{ .Values.auth.leewaySeconds | quote }}
  {{- with .Values.auth.corsOrigins }}
  ORRERY_CORS_ORIGINS: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secretsVolume.enabled }}
  ORRERY_SECRETS_DIR: {{ .Values.secretsVolume.mountPath | quote }}
  {{- end }}
