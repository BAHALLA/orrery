{{- /*
Kubernetes access for the agent's ServiceAccount (values: rbac). The rules
mirror the API calls the Kubernetes, Strimzi and ECK tools make; keep them in
step when a tool starts calling something new.
*/ -}}
{{- if .Values.rbac.create }}
{{- $profile := .Values.rbac.profile }}
{{- if not (has $profile (list "read" "operate")) }}
{{- fail (printf "rbac.profile must be read or operate, not %q" $profile) }}
{{- end }}
{{- $scope := .Values.rbac.scope }}
{{- if not (has $scope (list "cluster" "namespaces")) }}
{{- fail (printf "rbac.scope must be cluster or namespaces, not %q" $scope) }}
{{- end }}
{{- if and (eq $scope "namespaces") (empty .Values.rbac.namespaces) }}
{{- fail "rbac.scope=namespaces needs at least one entry in rbac.namespaces" }}
{{- end }}
{{- $name := include "orrery-assistant.fullname" . }}
{{- $sa := include "orrery-assistant.serviceAccountName" . }}
{{- if eq $sa "default" }}
{{- fail "rbac.create would grant the namespace's default ServiceAccount, and so every pod that sets none; set serviceAccount.create=true or serviceAccount.name, or rbac.create=false" }}
{{- end }}
{{- /* Cluster-scoped names carry the namespace: one release name installed
in two namespaces must not fight over one ClusterRole. */}}
{{- $clusterName := printf "%s-%s" .Release.Namespace $name }}
{{- if gt (len $clusterName) 50 }}
{{- /* Too long: keep a readable prefix and a hash of the whole, so two long
namespaces that share their first characters still get distinct names. */}}
{{- $clusterName = printf "%s-%s" (trunc 41 $clusterName | trimSuffix "-") (sha256sum $clusterName | trunc 8) }}
{{- end }}
{{- if eq $scope "cluster" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "orrery-assistant.labels" . | nindent 4 }}
rules:
  {{- include "orrery-assistant.rbacRules" (dict "Values" .Values "cluster" true) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "orrery-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $ns := .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "orrery-assistant.labels" $ | nindent 4 }}
rules:
  {{- include "orrery-assistant.rbacRules" (dict "Values" $.Values "cluster" false) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "orrery-assistant.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- with .Values.rbac.impersonate }}
{{- if or .users .groups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}-impersonator
  labels:
    {{- include "orrery-assistant.labels" $ | nindent 4 }}
rules:
  {{- with .users }}
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: {{ toJson . }}
  {{- end }}
  {{- with .groups }}
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: {{ toJson . }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}-impersonator
  labels:
    {{- include "orrery-assistant.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}-impersonator
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
