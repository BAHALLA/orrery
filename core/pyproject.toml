[project]
name = "orrery-core"
version = "0.3.1"
description = "Shared utilities for AI agents"
requires-python = ">=3.14"
dependencies = [
    # [db] pulls sqlalchemy, which ADK 2.0 moved out of the base package into
    # an extra; runner.py imports DatabaseSessionService unconditionally.
    "google-adk[eval,db]>=2.8.0",
    # ADK 2.2.0 transitively caps litellm at <1.86.0 (via
    # google-cloud-aiplatform[evaluation]); the workspace-root
    # override-dependencies in pyproject.toml lifts that cap. Keep this floor
    # in lockstep with that override.
    "litellm>=1.98.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Install with: uv sync --extra postgres
# Enables PostgreSQL-backed session storage for multi-instance deployments.
postgres = [
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.30.0",
]
# Install with: uv sync --extra auth
# JWT verification for HS256 + RS256/JWKS. Required to use verify_token()
# but NOT required for AuthPlugin alone (e.g. when a transport like
# Google Chat verifies tokens itself and writes _auth into state).
auth = [
    "pyjwt[crypto]>=2.13.0",
]
# Install with: uv sync --extra server
# Adds FastAPI + Uvicorn for the authenticated HTTP front door
# (orrery_core.server). Includes the auth dependencies transitively.
server = [
    "pyjwt[crypto]>=2.13.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "slowapi>=0.1.10",
]
# Install with: uv sync --extra otel
# OpenTelemetry tracing: configure_tracing() + TracingPlugin export ADK's
# native spans (agent / tool / LLM) to an OTLP collector (Tempo, Jaeger,
# Cloud Trace, ...). Imported lazily — the rest of the package never needs it.
otel = [
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
]
# Install with: uv sync --extra knowledge
# Elasticsearch-backed knowledge retrieval (AEP-025). Talks to the REST API
# with requests in a worker thread, mirroring agents/elasticsearch — no
# Elasticsearch client library, and the backend module is imported lazily so
# a deployment with ORRERY_KNOWLEDGE_BACKEND=none never needs this.
knowledge = [
    "requests>=2.34.2",
]
# Install with: uv sync --extra knowledge-pg
# pgvector-backed semantic retrieval (AEP-025 phase 2). Only the psycopg2
# driver is added — vectors go over the wire as pgvector's text literal cast
# in SQL, so the `pgvector` Python package is not required.
knowledge-pg = [
    "psycopg2-binary>=2.9.12",
]

[tool.setuptools.packages.find]
include = ["orrery_core*"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"
